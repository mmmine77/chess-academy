{% extends 'main/base.html' %}

{% block content %}
<style>
    .form-card {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        padding: 2rem;
        border-radius: 24px;
        border: 1px solid #e0e0e0;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .form-card h2 {
        color: #2c7da0;
        margin-bottom: 1.5rem;
        text-align: center;
        font-weight: 600;
    }
    .form-group {
        margin-bottom: 1rem;
    }
    .form-group label {
        display: block;
        color: #495057;
        margin-bottom: 0.5rem;
        font-weight: 500;
    }
    .form-group input, .form-group select {
        width: 100%;
        padding: 0.75rem;
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 12px;
        color: #212529;
        transition: all 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
        outline: none;
        border-color: #2c7da0;
        box-shadow: 0 0 0 3px rgba(44,125,160,0.1);
    }
    .btn-block {
        width: 100%;
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 30px;
        font-weight: 600;
    }
    .btn-primary {
        background: #2c7da0;
        color: white;
        border: none;
        transition: all 0.2s;
    }
    .btn-primary:hover {
        background: #1f5e7a;
        transform: translateY(-1px);
    }
    .btn-danger {
        background: #dc3545;
        color: white;
        border: none;
        transition: all 0.2s;
        display: block;
        text-align: center;
        margin-top: 1rem;
        text-decoration: none;
    }
    .btn-danger:hover {
        background: #bb2d3b;
    }
</style>

<div class="form-card">
    <h2>{{ title }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Название турнира</label>
            {{ form.name }}
        </div>
        <div class="form-group">
            <label>Дата</label>
            {{ form.date }}
        </div>
        <div class="form-group">
            <label>Время</label>
            {{ form.time }}
        </div>
        <div class="form-group">
            <label>Тип турнира</label>
            {{ form.type }}
        </div>
        <div class="form-group">
            <label>Место проведения / Платформа</label>
            {{ form.location }}
        </div>
        <div class="form-group">
            <label>Максимум участников</label>
            {{ form.max_participants }}
        </div>
        <button type="submit" class="btn btn-primary btn-block">Сохранить</button>
        <a href="/" class="btn btn-danger btn-block">Отмена</a>
    </form>
</div>
{% endblock %}
