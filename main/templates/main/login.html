{% extends 'main/base.html' %}

{% block content %}
<style>
    .login-form {
        max-width: 400px;
        margin: 50px auto;
        background: white;
        padding: 2rem;
        border-radius: 24px;
        border: 1px solid #e0e0e0;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .login-form h2 {
        color: #2c7da0;
        margin-bottom: 1.5rem;
        text-align: center;
        font-weight: 600;
    }
    .form-group {
        margin-bottom: 1rem;
    }
    .form-group label {
        display: block;
        color: #495057;
        margin-bottom: 0.5rem;
        font-weight: 500;
    }
    .form-group input {
        width: 100%;
        padding: 0.75rem;
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 12px;
        color: #212529;
        transition: all 0.2s;
    }
    .form-group input:focus {
        outline: none;
        border-color: #2c7da0;
        box-shadow: 0 0 0 3px rgba(44,125,160,0.1);
    }
    .btn-block {
        width: 100%;
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 30px;
        font-weight: 600;
    }
    .register-link {
        text-align: center;
        margin-top: 1rem;
        color: #6c757d;
    }
    .register-link a {
        color: #2c7da0;
        text-decoration: none;
        font-weight: 500;
    }
    .register-link a:hover {
        text-decoration: underline;
    }
    .error-message {
        background: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
        padding: 0.75rem;
        border-radius: 12px;
        margin-bottom: 1rem;
        text-align: center;
        font-size: 0.85rem;
    }
    .password-field {
        position: relative;
    }
    .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        color: #6c757d;
        transition: color 0.2s;
    }
    .toggle-password:hover {
        color: #2c7da0;
    }
    .btn-primary {
        background: #2c7da0;
        color: white;
        border: none;
        transition: all 0.2s;
    }
    .btn-primary:hover {
        background: #1f5e7a;
        transform: translateY(-1px);
    }
</style>

<div class="login-form">
    <h2>🔐 Вход в систему</h2>
    <form method="post">
        {% csrf_token %}

        {% if form.errors %}
        <div class="error-message">
            ⚠️ Неверный логин или пароль. Попробуйте снова.
        </div>
        {% endif %}

        <div class="form-group">
            <label>Имя пользователя</label>
            <input type="text" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <div class="password-field">
                <input type="password" name="password" id="loginPassword" required>
                <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">👁️</button>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>
    <div class="register-link">
        Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
    </div>
</div>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            button.textContent = '🙈';
        } else {
            input.type = 'password';
            button.textContent = '👁️';
        }
    }
</script>
{% endblock %}
