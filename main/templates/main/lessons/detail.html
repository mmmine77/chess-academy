{% extends 'main/base.html' %}

{% block content %}
<style>
    .detail-container {
        max-width: 700px;
        margin: 0 auto;
        background: white;
        padding: 2rem;
        border-radius: 24px;
        border: 1px solid #e0e0e0;
        box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }
    .detail-container h1 {
        color: #2c7da0;
        margin-bottom: 1rem;
        font-weight: 600;
    }
    .detail-info {
        margin: 1.5rem 0;
    }
    .detail-info p {
        margin-bottom: 0.8rem;
        color: #495057;
        font-size: 1rem;
    }
    .detail-info strong {
        color: #212529;
        width: 80px;
        display: inline-block;
        font-weight: 600;
    }
    .button-group {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
        flex-wrap: wrap;
    }
    .btn-back, .btn-edit, .btn-delete {
        padding: 0.5rem 1.5rem;
        border-radius: 30px;
        text-decoration: none;
        display: inline-block;
        font-weight: 500;
        transition: all 0.2s;
    }
    .btn-back {
        background: #2c7da0;
        color: white;
    }
    .btn-back:hover {
        background: #1f5e7a;
        transform: translateY(-1px);
    }
    .btn-edit {
        background: #ffc107;
        color: #212529;
    }
    .btn-edit:hover {
        background: #e0a800;
        transform: translateY(-1px);
    }
    .btn-delete {
        background: #dc3545;
        color: white;
    }
    .btn-delete:hover {
        background: #bb2d3b;
        transform: translateY(-1px);
    }
    @media (max-width: 768px) {
        .button-group {
            flex-direction: column;
        }
        .btn-back, .btn-edit, .btn-delete {
            text-align: center;
        }
    }
</style>

<div class="detail-container">
    <h1>{{ lesson.name }}</h1>

    <div class="detail-info">
        <p><strong>Дата:</strong> {{ lesson.date|date:"d.m.Y" }}</p>
        <p><strong>Время:</strong> {{ lesson.time|time:"H:i" }}</p>
        <p><strong>Адрес:</strong> {{ lesson.location|default:"Не указан" }}</p>
    </div>

    <div class="button-group">
        <a href="{% url 'lessons_list' %}" class="btn-back">Назад к расписанию</a>

        {% if user.role == 'admin' %}
            <a href="{% url 'lesson_edit' lesson.id %}" class="btn-edit">Редактировать</a>
            <a href="{% url 'lesson_delete' lesson.id %}" class="btn-delete" onclick="return confirm('Удалить урок?')">Удалить</a>
        {% endif %}
    </div>
</div>
{% endblock %}
