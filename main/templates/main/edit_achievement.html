{% extends 'main/base.html' %}

{% block content %}
<style>
    .form-container {
        max-width: 500px;
        margin: 0 auto;
        background: #1a1a1a;
        padding: 2rem;
        border-radius: 16px;
        border: 1px solid #333;
    }
    .form-container h2 {
        color: #81c784;
        margin-bottom: 1.5rem;
    }
    .form-group {
        margin-bottom: 1rem;
    }
    .form-group label {
        display: block;
        color: #b0b0b0;
        margin-bottom: 0.5rem;
    }
    .form-group input, .form-group textarea {
        width: 100%;
        padding: 0.75rem;
        background: #2a2a2a;
        border: 1px solid #404040;
        border-radius: 8px;
        color: #fff;
    }
    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }
    .btn-submit {
        background: #81c784;
        color: #000;
        padding: 0.75rem;
        border: none;
        border-radius: 8px;
        width: 100%;
        cursor: pointer;
        font-weight: bold;
    }
    .btn-cancel {
        display: block;
        text-align: center;
        margin-top: 1rem;
        color: #81c784;
        text-decoration: none;
    }
</style>

<div class="form-container">
    <h2>✏️ Редактирование достижения</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Название</label>
            <input type="text" name="name" value="{{ achievement.name }}" required>
        </div>
        <div class="form-group">
            <label>Описание</label>
            <textarea name="description" rows="3" required>{{ achievement.description }}</textarea>
        </div>
        <button type="submit" class="btn-submit">Сохранить</button>
    </form>
    <a href="{% url 'users_list' %}" class="btn-cancel">← Назад</a>
</div>
{% endblock %}
