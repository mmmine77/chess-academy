{% extends 'main/base.html' %}

{% block content %}
<style>
    .edit-form {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        padding: 2rem;
        border-radius: 24px;
        border: 1px solid #e0e0e0;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .edit-form h2 {
        color: #2c7da0;
        margin-bottom: 1.5rem;
        text-align: center;
        font-weight: 600;
    }
    .form-group {
        margin-bottom: 1rem;
    }
    .form-group label {
        display: block;
        color: #495057;
        margin-bottom: 0.5rem;
        font-weight: 500;
    }
    .form-group input, .form-group textarea {
        width: 100%;
        padding: 0.75rem;
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 12px;
        color: #212529;
        transition: all 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus {
        outline: none;
        border-color: #2c7da0;
        box-shadow: 0 0 0 3px rgba(44,125,160,0.1);
    }
    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }
    .btn-block {
        width: 100%;
        padding: 0.75rem;
        border-radius: 30px;
        font-weight: 600;
    }
    .btn-cancel {
        display: block;
        text-align: center;
        margin-top: 1rem;
        text-decoration: none;
        padding: 0.75rem;
        border-radius: 30px;
    }
    .btn-primary {
        background: #2c7da0;
        color: white;
        border: none;
        transition: all 0.2s;
    }
    .btn-primary:hover {
        background: #1f5e7a;
        transform: translateY(-1px);
    }
    .btn-danger {
        background: #dc3545;
        color: white;
        border: none;
        transition: all 0.2s;
    }
    .btn-danger:hover {
        background: #bb2d3b;
    }
</style>

<div class="edit-form">
    <h2>✏️ Редактирование профиля</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Полное имя</label>
            {{ form.full_name }}
        </div>
        <div class="form-group">
            <label>Email</label>
            {{ form.email }}
        </div>
        <div class="form-group">
            <label>Город</label>
            {{ form.city }}
        </div>
        <div class="form-group">
            <label>Телефон</label>
            {{ form.phone }}
        </div>
        <div class="form-group">
            <label>О себе</label>
            {{ form.bio }}
        </div>
        <button type="submit" class="btn btn-primary btn-block">Сохранить</button>
        <a href="{% url 'profile' %}" class="btn btn-danger btn-cancel">Отмена</a>
    </form>
</div>
{% endblock %}
