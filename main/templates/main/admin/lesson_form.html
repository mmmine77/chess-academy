{% extends 'main/base.html' %}

{% block content %}
<style>
    .form-container {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        padding: 2rem;
        border-radius: 24px;
        border: 1px solid #e0e0e0;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .form-container h2 {
        color: #2c7da0;
        margin-bottom: 1.5rem;
        font-weight: 600;
    }
    .form-group {
        margin-bottom: 1rem;
    }
    .form-group label {
        display: block;
        color: #495057;
        margin-bottom: 0.5rem;
        font-weight: 500;
    }
    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 0.75rem;
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 12px;
        color: #212529;
        transition: all 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #2c7da0;
        box-shadow: 0 0 0 3px rgba(44,125,160,0.1);
    }
    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }
    .btn-submit {
        background: #2c7da0;
        color: white;
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        margin-top: 1rem;
        width: 100%;
        transition: all 0.2s;
    }
    .btn-submit:hover {
        background: #1f5e7a;
        transform: translateY(-1px);
    }
    .btn-cancel {
        background: #dc3545;
        color: white;
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        font-size: 1rem;
        margin-top: 0.5rem;
        width: 100%;
        text-align: center;
        display: inline-block;
        text-decoration: none;
        transition: all 0.2s;
    }
    .btn-cancel:hover {
        background: #bb2d3b;
        transform: translateY(-1px);
    }
</style>

<div class="form-container">
    <h2>{{ title }}</h2>
    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Тема урока *</label>
            <input type="text" name="name" value="{{ lesson.name|default:'' }}" required placeholder="Введите тему урока">
        </div>

        <div class="form-group">
            <label>Описание</label>
            <textarea name="description" rows="3" placeholder="Описание урока">{{ lesson.description|default:'' }}</textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Дата *</label>
                <input type="date" name="date" value="{{ lesson.date|date:'Y-m-d'|default:'' }}" required>
            </div>
            <div class="form-group">
                <label>Время *</label>
                <input type="time" name="time" value="{{ lesson.time|time:'H:i'|default:'' }}" required>
            </div>
        </div>

        <div class="form-group">
            <label>Адрес *</label>
            <input type="text" name="location" value="{{ lesson.location|default:'' }}" required placeholder="г. Москва, ул. Примерная, д. 1">
        </div>

        <button type="submit" class="btn-submit">{% if lesson %}Сохранить{% else %}Создать урок{% endif %}</button>
        <a href="{% url 'lessons_list' %}" class="btn-cancel">Отмена</a>
    </form>
</div>
{% endblock %}
